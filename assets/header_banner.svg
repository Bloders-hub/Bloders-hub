<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#3fb950;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#3fb950;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#58a6ff;#bc8cff;#3fb950" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#d2a8ff" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .floating-title {
      animation: float 4s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Ubuntu', 'Roboto', sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: 4px;
      fill: url(#textGrad);
      filter: drop-shadow(0 0 12px rgba(88, 166, 255, 0.45));
    }
    .subtitle-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 1.5px;
      fill: #8b949e;
    }
    .dot-1 { animation: pulseDot 3s ease-in-out infinite; }
    .dot-2 { animation: pulseDot 2.5s ease-in-out 1s infinite; }
    .dot-3 { animation: pulseDot 3.5s ease-in-out 0.5s infinite; }
  </style>

  <!-- Background Base -->
  <rect x="0" y="0" width="900" height="220" rx="16" fill="url(#headerGrad)" />

  <!-- Cyber Dots Background -->
  <g fill="#58a6ff" opacity="0.3">
    <circle cx="80" cy="40" r="1.5" class="dot-1" />
    <circle cx="150" cy="70" r="2" class="dot-2" />
    <circle cx="820" cy="50" r="2" class="dot-3" />
    <circle cx="750" cy="80" r="1.5" class="dot-1" />
    <circle cx="230" cy="30" r="1" class="dot-2" />
    <circle cx="680" cy="40" r="1.5" class="dot-3" />
  </g>

  <!-- Flowing Bottom Neon Wave -->
  <path d="M 0,165 Q 150,135 300,165 T 600,165 T 900,165 L 900,220 L 0,220 Z" fill="url(#waveGrad)" opacity="0.15" />
  <path d="M 0,180 Q 225,150 450,180 T 900,180 L 900,220 L 0,220 Z" fill="url(#waveGrad)" opacity="0.4" />
  <path d="M 0,195 Q 225,180 450,195 T 900,195 L 900,220 L 0,220 Z" fill="url(#waveGrad)" opacity="0.85" />

  <!-- Glowing Border Outline -->
  <rect x="1" y="1" width="898" height="218" rx="16" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Center Content -->
  <g class="floating-title" text-anchor="middle">
    <text x="450" y="95" class="title-text">BLODERS LAB</text>
    <text x="450" y="135" class="subtitle-text">SYSTEMS &amp; DISTRIBUTED INFRASTRUCTURE ENGINEER</text>
  </g>
</svg>